services:
  # The Go service powering API.
  backend:
    image: fireflyzero/backend:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      API_POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - 0.0.0.0:${API_PORT}:${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  # # Background job scheduler.
  # scheduler:
  #   image: fireflyzero/scheduler:latest
  #   build:
  #     context: .
  #     dockerfile: scheduler.Dockerfile
  #   environment:
  #     POSTGRES_HOST: postgres
  #     API_POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #   env_file:
  #     - .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     migrations:
  #       condition: service_completed_successfully

  # Image applying migrations to the database.
  migrations:
    image: fireflyzero/migrations:latest
    build:
      context: .
      dockerfile: migrations.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      API_POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # Database.
  postgres:
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 2s
      retries: 5
